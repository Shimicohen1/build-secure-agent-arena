name: Secure build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and development checks
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Scan Python source
        run: python -m bandit -q -r arena

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test-and-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble Pages bundle
        run: |
          mkdir -p site/assets
          cp arena/static/index.html site/index.html
          cp arena/static/app.js arena/static/scenarios.json arena/static/styles.css site/assets/
      - name: Upload static demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy static demo
        id: deployment
        uses: actions/deploy-pages@v4
