name: Secure build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and development checks
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Scan Python source
        run: python -m bandit -q -r arena
