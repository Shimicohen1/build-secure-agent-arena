[project]
name = "build-secure-agent-arena"
version = "0.1.0"
description = "Build Secure: live AI-agent attack/defense arena (naive vs hardened agent, same attacks, different fate)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "bandit>=1.7",
    "httpx>=0.27",
]

[project.scripts]
arena = "arena.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["arena*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
